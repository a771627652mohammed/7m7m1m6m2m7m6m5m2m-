<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام فواتير - إدارة الأشخاص والدائن والمدين</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tahoma', 'Segoe UI', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            padding: 20px;
        }

        .main-container {
            max-width: 1600px;
            margin: 0 auto;
        }

        /* ===== TABS ===== */
        .tabs {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .tab-btn {
            padding: 14px 28px;
            background: rgba(255, 255, 255, 0.08);
            color: #ccc;
            border: 2px solid transparent;
            border-radius: 14px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
            backdrop-filter: blur(4px);
        }

        .tab-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            transform: translateY(-2px);
        }

        .tab-btn.active {
            background: #fff;
            color: #302b63;
            border-color: #302b63;
            box-shadow: 0 8px 30px rgba(48, 43, 99, 0.4);
        }

        .tab-btn:active {
            transform: scale(0.95);
        }

        .tab-content {
            display: none;
            background: #fff;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            animation: fadeIn 0.4s ease;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== HEADERS ===== */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            border-bottom: 3px solid #302b63;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        .section-header h2 {
            color: #302b63;
            font-size: 24px;
        }

        .section-header .badge {
            background: #302b63;
            color: white;
            padding: 6px 18px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: bold;
        }

        /* ===== TABLES ===== */
        .table-wrapper {
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid #e0e0e0;
            margin-bottom: 20px;
            position: relative;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            min-width: 1300px;
        }

        thead {
            background: linear-gradient(135deg, #302b63, #4a3f8a);
            color: white;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        th {
            padding: 12px 8px;
            text-align: center;
            font-weight: 700;
            white-space: nowrap;
            font-size: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        td {
            padding: 10px 6px;
            text-align: center;
            border-bottom: 1px solid #eee;
            vertical-align: middle;
            transition: 0.3s;
        }

        tbody tr {
            transition: 0.3s;
        }

        tbody tr:hover {
            background: #f5f3ff;
        }

        tbody tr:last-child {
            border-bottom: 3px solid #302b63;
        }

        .input-cell input {
            width: 70px;
            padding: 5px 6px;
            border: 2px solid #ddd;
            border-radius: 8px;
            text-align: center;
            font-size: 12px;
            transition: 0.3s;
            background: white;
        }

        .input-cell input:focus {
            border-color: #302b63;
            outline: none;
            box-shadow: 0 0 0 3px rgba(48, 43, 99, 0.15);
            transform: scale(1.02);
        }

        .input-cell input[type="number"] {
            -moz-appearance: textfield;
        }
        .input-cell input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
        }

        .input-cell input.name-input {
            width: 130px;
        }

        .input-cell input.party-input {
            width: 150px;
            font-weight: bold;
            border-color: #8b5cf6;
            background: #f8f6ff;
        }

        .input-cell input.party-input:focus {
            border-color: #8b5cf6;
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2);
        }

        /* ===== PARTY COLOR CODING ===== */
        .party-color-1 {
            background: #f0f8ff !important;
        }
        .party-color-2 {
            background: #f5f0ff !important;
        }
        .party-color-3 {
            background: #fff5f0 !important;
        }
        .party-color-4 {
            background: #f0fff5 !important;
        }
        .party-color-5 {
            background: #fff0f5 !important;
        }

        .badge-paid {
            background: #10b981;
            color: white;
            padding: 3px 12px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: bold;
        }
        .badge-debtor {
            background: #3b82f6;
            color: white;
            padding: 3px 12px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: bold;
        }
        .badge-creditor {
            background: #8b5cf6;
            color: white;
            padding: 3px 12px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: bold;
        }

        /* ===== IMAGE UPLOAD ===== */
        .image-upload-cell {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .image-upload-cell img {
            width: 45px;
            height: 45px;
            object-fit: cover;
            border-radius: 8px;
            border: 2px solid #ddd;
            cursor: pointer;
            transition: 0.3s;
        }

        .image-upload-cell img:hover {
            transform: scale(1.1);
            border-color: #302b63;
        }

        .image-upload-cell input[type="file"] {
            display: none;
        }

        .image-upload-cell .upload-btn {
            background: #302b63;
            color: white;
            border: none;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 10px;
            cursor: pointer;
            transition: 0.3s;
        }

        .image-upload-cell .upload-btn:hover {
            background: #4a3f8a;
            transform: scale(1.05);
        }

        .image-upload-cell .upload-btn:active {
            transform: scale(0.95);
        }

        .image-preview {
            width: 45px;
            height: 45px;
            border-radius: 8px;
            border: 2px dashed #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #ccc;
            background: #f8f9fc;
        }

        /* ===== SUMMARY CARDS ===== */
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 12px;
            margin: 20px 0;
        }

        .summary-card {
            background: #f8f9fc;
            padding: 14px 16px;
            border-radius: 14px;
            text-align: center;
            border-right: 4px solid #302b63;
            transition: 0.3s;
            cursor: default;
        }

        .summary-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(48, 43, 99, 0.12);
        }

        .summary-card .label {
            font-size: 11px;
            color: #888;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .summary-card .value {
            font-size: 22px;
            font-weight: 900;
            color: #302b63;
            margin-top: 4px;
        }

        .summary-card .value.positive {
            color: #10b981;
        }
        .summary-card .value.negative {
            color: #ef4444;
        }
        .summary-card .value.warning {
            color: #f59e0b;
        }
        .summary-card .value.blue {
            color: #3b82f6;
        }
        .summary-card .value.purple {
            color: #8b5cf6;
        }

        /* ===== PARTY TABLE ===== */
        .party-summary-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        .party-summary-table th {
            background: linear-gradient(135deg, #302b63, #4a3f8a);
            color: white;
            padding: 12px;
            text-align: center;
        }

        .party-summary-table td {
            padding: 10px;
            text-align: center;
            border-bottom: 1px solid #eee;
        }

        .party-summary-table tr:hover {
            background: #f5f3ff;
        }

        .party-summary-table .total-row {
            background: #f0edff;
            font-weight: bold;
            border-top: 3px solid #302b63;
        }

        .party-summary-table .total-row td {
            padding: 12px;
            font-size: 15px;
        }

        /* ===== BUTTONS ===== */
        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .btn {
            padding: 10px 22px;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            user-select: none;
            position: relative;
            overflow: hidden;
        }

        .btn::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transition: width 0.6s, height 0.6s, top 0.6s, left 0.6s;
        }

        .btn:active::after {
            width: 300px;
            height: 300px;
            top: -100px;
            left: -100px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-primary {
            background: #302b63;
            color: white;
        }
        .btn-primary:hover {
            background: #4a3f8a;
        }

        .btn-success {
            background: #10b981;
            color: white;
        }
        .btn-success:hover {
            background: #059669;
        }

        .btn-danger {
            background: #ef4444;
            color: white;
        }
        .btn-danger:hover {
            background: #dc2626;
        }

        .btn-warning {
            background: #f59e0b;
            color: white;
        }
        .btn-warning:hover {
            background: #d97706;
        }

        .btn-outline {
            background: transparent;
            color: #302b63;
            border: 2px solid #302b63;
        }
        .btn-outline:hover {
            background: #302b63;
            color: white;
        }

        .btn-purple {
            background: #8b5cf6;
            color: white;
        }
        .btn-purple:hover {
            background: #7c3aed;
        }

        .btn-blue {
            background: #3b82f6;
            color: white;
        }
        .btn-blue:hover {
            background: #2563eb;
        }

        .btn-pink {
            background: #ec4899;
            color: white;
        }
        .btn-pink:hover {
            background: #db2777;
        }

        .btn-sm {
            padding: 4px 12px;
            font-size: 11px;
        }

        .btn-delete-row {
            background: #ef4444;
            color: white;
            border: none;
            padding: 3px 10px;
            border-radius: 8px;
            font-size: 11px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-delete-row:hover {
            background: #dc2626;
            transform: scale(1.05);
        }

        .btn-delete-row:active {
            transform: scale(0.9);
        }

        /* ===== ADD PARTY MODAL ===== */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 999;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 20px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            animation: modalIn 0.3s ease;
        }

        @keyframes modalIn {
            from {
                transform: scale(0.8);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .modal-content h3 {
            color: #302b63;
            margin-bottom: 20px;
        }

        .modal-content .close-btn {
            float: left;
            font-size: 28px;
            cursor: pointer;
            color: #888;
            transition: 0.3s;
        }

        .modal-content .close-btn:hover {
            color: #ef4444;
            transform: rotate(90deg);
        }

        .modal-content input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            margin: 10px 0;
            transition: 0.3s;
        }

        .modal-content input:focus {
            border-color: #8b5cf6;
            outline: none;
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2);
        }

        .modal-content .modal-btn-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .modal-content .modal-btn-group .btn {
            flex: 1;
            justify-content: center;
        }

        /* ===== TOAST NOTIFICATION ===== */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #302b63;
            color: white;
            padding: 15px 25px;
            border-radius: 14px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            font-weight: 700;
            font-size: 14px;
            transform: translateY(100px);
            opacity: 0;
            transition: 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 1000;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast.success {
            background: #10b981;
        }
        .toast.warning {
            background: #f59e0b;
        }
        .toast.error {
            background: #ef4444;
        }
        .toast.info {
            background: #3b82f6;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 600px) {
            .tab-btn {
                padding: 10px 16px;
                font-size: 13px;
            }
            .tab-content {
                padding: 15px;
            }
            .summary-grid {
                grid-template-columns: 1fr 1fr;
            }
            .input-cell input {
                width: 50px;
                font-size: 10px;
                padding: 4px;
            }
            .input-cell input.name-input {
                width: 80px;
            }
            .input-cell input.party-input {
                width: 90px;
            }
            th,
            td {
                font-size: 10px;
                padding: 5px 3px;
            }
            .section-header h2 {
                font-size: 18px;
            }
            .image-upload-cell img {
                width: 35px;
                height: 35px;
            }
            .btn {
                padding: 8px 14px;
                font-size: 11px;
            }
            .toast {
                right: 10px;
                left: 10px;
                bottom: 10px;
                font-size: 12px;
                padding: 12px 18px;
            }
        }

        @media print {
            body {
                background: white;
                padding: 10px;
            }
            .tab-content {
                box-shadow: none;
                padding: 15px;
                display: block !important;
            }
            .btn-group,
            .tabs {
                display: none !important;
            }
            .summary-card {
                border: 1px solid #ddd;
            }
            .tab-btn {
                display: none;
            }
            .btn {
                display: none !important;
            }
        }
    </style>
</head>
<body>

        </div>
